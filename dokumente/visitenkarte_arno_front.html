<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Visitenkarte – Arno Lanziner (Front)</title>

<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background:#222;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        min-height:100vh;
        font-family:Helvetica, sans-serif;
        padding:2rem;
        gap:2rem;
    }

    /* VISITENKARTE: 85mm × 55mm */
    .card {
        width:85mm;
        height:55mm;
        position:relative;
        overflow:hidden;
        background:#020C18;
        border-radius:3.5mm;
        box-shadow:0 8px 40px rgba(0,0,0,0.6);
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }

    /* Grid background */
    .card::before {
        content:'';
        position:absolute;
        inset:0;
        background-image:
            linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
        background-size:8mm 8mm;
        pointer-events:none;
    }

    /* TOP LINE */
    .top-line {
        position:absolute;
        top:0; left:0; right:0;
        height:2px;
        background:linear-gradient(to right, transparent, #00D4FF 30%, #00D4FF 70%, transparent);
    }
    .bottom-line {
        position:absolute;
        bottom:0; left:0; right:0;
        height:2px;
        background:linear-gradient(to right, #FF6B35, #00D4FF);
    }

    /* FRONT */
    .card-front {
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        padding:5mm 6mm 5mm;
        height:100%;
        position:relative;
    }

    .person-name {
        font-family:Arial, sans-serif;
        font-size:18pt;
        color:#fff;
        letter-spacing:0.04em;
        line-height:1;
    }
    .person-title {
        font-family:Helvetica, sans-serif;
        font-size:7pt;
        font-weight:600;
        letter-spacing:0.15em;
        text-transform:uppercase;
        color:#00D4FF;
    }

    .front-bottom {
        display:flex;
        flex-direction:column;
        gap:1.5mm;
    }
    .contact-row {
        display:flex;
        align-items:center;
        gap:2mm;
    }
    .contact-row svg { width:3.5mm; height:3.5mm; flex-shrink:0; }
    .contact-row span, .contact-row a {
        font-size:7pt;
        color:#A0B8CC;
        font-weight:500;
        text-decoration:none;
    }

    /* PRINT */
    @media print {
        body { background:white; padding:0; margin:0; gap:0; min-height:auto; }
        .card { box-shadow:none; border-radius:0; }
    }
</style>
</head>
<body>

<div class="card">
    <div class="top-line"></div>
    <div class="card-front" style="flex-direction:row;align-items:stretch;padding:5mm 6mm 5mm 6mm;gap:2mm;">
        <!-- Left: name + contact -->
        <div style="display:flex;flex-direction:column;justify-content:space-between;flex:1;">
            <div>
                <div class="person-name">Arno<br>Lanziner</div>
                <div class="person-title" style="margin-top:1mm;">Founder & CEO</div>
            </div>
            <div class="front-bottom">
                <div class="contact-row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.22 2.18 2 2 0 012.22 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.35 6.35l1.27-1.56a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                    <span>+39 335 285676</span>
                </div>
                <div class="contact-row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    <span>info@aquarescuesystems.com</span>
                </div>
                <div class="contact-row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                    <span>aquarescuesystems.com</span>
                </div>
            </div>
        </div>
        <!-- Right: Dolphin top, QR bottom -->
        <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:0;">
            <!-- Top: Dolphin -->
            <div style="display:flex;">
                <img src="../assets/images/dolphin3_front.png" alt="Dolphin 3" style="width:16mm;height:auto;filter:drop-shadow(0 0 1mm rgba(255,107,53,0.2)) brightness(0.8);"/>
            </div>
            <!-- Bottom: QR -->
            <div style="background:white;padding:1mm 1mm 0.5mm 1mm;border-radius:1.5mm;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=https://aquarescuesystems.com&bgcolor=ffffff&color=020C18&margin=1" width="52mm" height="52mm" alt="QR"/>
            </div>
        </div>
    </div>
    <div class="bottom-line"></div>
</div>

</body>
</html>
