<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Visitenkarte – Arno Lanziner (Back)</title>

<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background:#222;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        min-height:100vh;
        font-family:Helvetica, sans-serif;
        padding:2rem;
        gap:2rem;
    }

    /* VISITENKARTE: 85mm × 55mm */
    .card {
        width:85mm;
        height:55mm;
        position:relative;
        overflow:hidden;
        background:#020C18;
        border-radius:3.5mm;
        box-shadow:0 8px 40px rgba(0,0,0,0.6);
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }

    /* Grid background */
    .card::before {
        content:'';
        position:absolute;
        inset:0;
        background-image:
            linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
        background-size:8mm 8mm;
        pointer-events:none;
    }

    /* TOP LINE */
    .top-line {
        position:absolute;
        top:0; left:0; right:0;
        height:2px;
        background:linear-gradient(to right, transparent, #00D4FF 30%, #00D4FF 70%, transparent);
    }
    .bottom-line {
        position:absolute;
        bottom:0; left:0; right:0;
        height:2px;
        background:linear-gradient(to right, #FF6B35, #00D4FF);
    }

    /* BACK */
    .card-back {
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        height:100%;
        gap:4mm;
        position:relative;
    }

    /* PRINT */
    @media print {
        body { background:white; padding:0; margin:0; gap:0; min-height:auto; }
        .card { box-shadow:none; border-radius:0; }
    }
</style>
</head>
<body>

<div class="card">
    <div class="top-line"></div>
    <div class="card-back" style="display:flex;align-items:center;justify-content:center;padding:5mm;">
        <!-- Logo centered -->
        <img src="../assets/logos/ars_logo_transparent.svg" alt="ARS Logo" style="width:60mm;height:auto;"/>
    </div>
    <div class="bottom-line"></div>
</div>

</body>
</html>
